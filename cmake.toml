# Reference: https://build-cpp.github.io/cmkr/cmake-toml
# to build (32-bit ONLY -- FEAR2.exe is a Win32 process):
#   > cmake -B build -G "Visual Studio 18 2026" -A Win32
#   > cmake --build build --config RelWithDebInfo
#
# fear2vr: an injected-DLL mod framework for F.E.A.R. 2: Project Origin
# (LithTech Jupiter EX, 32-bit, D3D9). Structure mirrors REFramework/UEVR:
#   shared/sdk/   -- game SDK (mapped from IDA, static lib fear2-sdk)
#   src/          -- framework DLL core (lifecycle, hooks, IPC, mods)
#   injector/     -- LoadLibrary injector (inject/unload/reload/status)
#   test/         -- ctest drivers (fixture = the game itself)

[project]
name = "fear2vr"
languages = ["CXX", "C"]
cmake-before = """
set(CMAKE_POLICY_VERSION_MINIMUM 3.5)
add_compile_options($<$<CXX_COMPILER_ID:MSVC>:/MP>)

# RelWithDebInfo is the standard config (optimized + debuggable, PDBs always
# present natively). Fold/trim unused code the same way a Release build
# would -- RelWithDebInfo's own defaults don't include these link-time
# optimizations.
add_link_options("$<$<CONFIG:RelWithDebInfo>:/OPT:REF>")
add_link_options("$<$<CONFIG:RelWithDebInfo>:/OPT:ICF>")

"""

cmake-after = """
if(NOT CMAKE_SIZEOF_VOID_P EQUAL 4)
    message(FATAL_ERROR "fear2vr must be built 32-bit: re-run cmake with -A Win32. Detected pointer size: ${CMAKE_SIZEOF_VOID_P}")
endif()

# Static CRT so the injected DLL has no VC runtime dependency in the target.
set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded$<$<CONFIG:Debug>:Debug>")

# ctest support (targets register add_test in their own cmake-after blocks).
enable_testing()
"""

# --- dependencies ----------------------------------------------------------

# kananlib (pattern scanning, module helpers, Address/PointerHook).
# As a subproject it needs its bddisasm dependency; have it fetch it itself.
[fetch-content.kananlib]
git = "https://github.com/cursey/kananlib"
tag = "43b97a97bd3ad038f2e80ba83318371eed7b4ca6"
cmake-before = """
set(KANANLIB_FETCH_BDDISASM ON CACHE BOOL "" FORCE)
set(KANANLIB_FETCH_SPDLOG ON CACHE BOOL "" FORCE)
"""

# SafetyHook (inline function detouring, x86 supported). Pin matches REFramework.
[fetch-content.safetyhook]
git = "https://github.com/cursey/safetyhook.git"
tag = "b046e123dc69821f2c375161e0adef3c6d9c9db4"
cmake-before = """
set(SAFETYHOOK_FETCH_ZYDIS ON CACHE BOOL "" FORCE)
"""

# --- shared/sdk: LithTech (FEAR2 build) SDK mapped from IDA -----------------
# Game-agnostic-ish engine bindings: module resolution, engine globals,
# interfaces (ILTClient, IDatabaseMgr...). Consumed by fear2-core and tests.
[target.fear2-sdk]
type = "static"
sources = ["shared/sdk/**.cpp", "shared/xr/**.cpp"]
headers = ["shared/sdk/**.hpp", "shared/xr/**.hpp", "shared/xr/**.h"]
# No deps/openxr/include any more: the 32-bit OpenXR surface is gone and shared/xr now holds only
# SharedFrame.hpp, which is deliberately free of OpenXR types so both bitnesses can compile it.
include-directories = ["shared"]
compile-features = ["cxx_std_23"]
compile-options = ["/EHa", "/bigobj", "/GS-"]
compile-definitions = ["NOMINMAX", "WIN32_LEAN_AND_MEAN", "_CRT_SECURE_NO_WARNINGS"]
link-libraries = ["d3d11", "dxgi", "kananlib"]

[target.fear2-sdk.properties]
POSITION_INDEPENDENT_CODE = "ON"

# --- fear2-core: lifecycle, hooks, IPC, mods (everything but DllMain) -------
# Static lib so the injected DLL AND any future tool/test link the same
# teardown-critical code (graceful uninject lives in exactly ONE place).
[target.fear2-core]
type = "static"
sources = ["src/AgentRuntime.cpp", "src/ExceptionHandler.cpp", "src/Framework.cpp", "src/Hooks.cpp", "src/Mods.cpp", "src/ipc/**.cpp", "src/mods/**.cpp", "shared/Log.cpp"]
headers = ["src/**.hpp", "shared/**.hpp"]
include-directories = ["src", "shared"]
compile-features = ["cxx_std_23"]
compile-options = ["/EHa", "/bigobj", "/GS-"]
compile-definitions = ["NOMINMAX", "WIN32_LEAN_AND_MEAN", "_CRT_SECURE_NO_WARNINGS"]
link-libraries = ["fear2-sdk", "kananlib", "safetyhook", "ws2_32", "shlwapi", "dbghelp"]

[target.fear2-core.properties]
POSITION_INDEPENDENT_CODE = "ON"

# --- the injected mod DLL: thin DllMain entrypoint over fear2-core ----------
[target.fear2vr]
type = "shared"
sources = ["src/Main.cpp"]
include-directories = ["src", "shared"]
compile-features = ["cxx_std_23"]
compile-options = ["/EHa", "/bigobj", "/GS-"]
compile-definitions = ["NOMINMAX", "WIN32_LEAN_AND_MEAN", "_CRT_SECURE_NO_WARNINGS"]
link-libraries = ["fear2-core", "fear2-sdk", "kananlib", "safetyhook", "ws2_32", "shlwapi", "dbghelp"]
cmake-after = """
# ---- NO OPENXR IN THE GAME ----------------------------------------------------------------------
#
# The mod contains no OpenXR code at all: the runtime, the loader, the instance and the session all
# live in the 64-bit host (tools/xr64), and the game talks to it purely over the shared mapping in
# shared/xr/SharedFrame.hpp. So nothing here ever loads openxr_loader.dll.
#
# The delete below is housekeeping for trees that built while an earlier attempt DID ship a 32-bit
# loader here. Dropping a copy rule does not remove what it already copied, and a leftover DLL in
# bin/ invites exactly the wrong conclusion about where OpenXR runs. Same class of trap as a stale
# CMake cache silently not compiling a new .cpp (AGENTS.md rule 10).
#
# Why that attempt was reverted, recorded because the numbers cost a session to get: shipping it
# moved the mod onto the Khronos loader, which loads fine under LAA and enumerates 89 extensions
# (against 35 direct, the difference being the implicit API layers the loader inserts) and then
# fails xrCreateInstance with XR_ERROR_FILE_ACCESS_ERROR (-32). A conformant path that cannot
# create an instance is worse than a less conformant one that can.
add_custom_command(TARGET fear2vr POST_BUILD
	COMMAND ${CMAKE_COMMAND} -E rm -f "$<TARGET_FILE_DIR:fear2vr>/openxr_loader.dll"
	VERBATIM)
"""

[target.fear2vr.properties]
OUTPUT_NAME = "fear2vr"
RUNTIME_OUTPUT_DIRECTORY_RELEASE = "${CMAKE_BINARY_DIR}/bin"
RUNTIME_OUTPUT_DIRECTORY_RELWITHDEBINFO = "${CMAKE_BINARY_DIR}/bin"
RUNTIME_OUTPUT_DIRECTORY_DEBUG = "${CMAKE_BINARY_DIR}/bin"
PREFIX = ""

# --- the LoadLibrary injector ----------------------------------------------
[target.injector]
type = "executable"
sources = ["injector/Injector.cpp"]
include-directories = ["shared"]
compile-features = ["cxx_std_23"]
compile-definitions = ["NOMINMAX", "WIN32_LEAN_AND_MEAN", "_CRT_SECURE_NO_WARNINGS"]
link-libraries = ["ws2_32", "shell32"]

cmake-after = """
# staging/ holds what the injector places next to the game (DXVK's d3d9.dll and its licence).
# Copy it beside injector.exe so the injector's own 'look next to me' lookup finds it -- one
# mechanism, no search paths. copy_directory_if_different is a no-op when nothing changed, so this
# does not dirty the output on every build.
add_custom_command(TARGET injector POST_BUILD
    COMMAND ${CMAKE_COMMAND} -E copy_directory_if_different
        "${CMAKE_CURRENT_SOURCE_DIR}/staging"
        "$<TARGET_FILE_DIR:injector>"
    COMMENT "Staging DXVK and its licence beside injector.exe"
    VERBATIM)
"""

[target.injector.properties]
OUTPUT_NAME = "injector"
RUNTIME_OUTPUT_DIRECTORY_RELEASE = "${CMAKE_BINARY_DIR}/bin"
RUNTIME_OUTPUT_DIRECTORY_RELWITHDEBINFO = "${CMAKE_BINARY_DIR}/bin"
RUNTIME_OUTPUT_DIRECTORY_DEBUG = "${CMAKE_BINARY_DIR}/bin"

# --- ctest E2E runner -------------------------------------------------------
# Drives the DLL against the live game (FEAR2.exe is the fixture) and asserts
# the in-DLL test suite returns fail==0. SKIPS (exit 77) when the game cannot
# be spawned/attached, so CI without the game is green-skipped.
[target.fixture-test]
type = "executable"
sources = ["test/fixture_test_runner.cpp"]
include-directories = ["shared"]
compile-features = ["cxx_std_23"]
compile-definitions = ["NOMINMAX", "WIN32_LEAN_AND_MEAN", "_CRT_SECURE_NO_WARNINGS"]
link-libraries = ["ws2_32"]
cmake-after = """
add_test(
    NAME fixture-test
    COMMAND fixture-test
        --injector $<TARGET_FILE:injector>
        --dll      $<TARGET_FILE:fear2vr>
        --fixture  "W:/SteamLibrary/steamapps/common/FEAR2/FEAR2.exe"
        --port     8798
)
# 420s, not 180. The suite is ~85s, plus up to ~25s if it has to cold-start the game through
# `injector.exe --launch` (measured after resume_game.py stopped blind-sleeping; it used to be
# 165s). The suite grew a closed-loop aim director whose checks physically turn the player:
# driving the pitch into both clamps and back is several seconds each, and a checkpoint restore
# (only taken when the fixture is unusable) is ~15s on its own. Measured at ~90s healthy, and it
# timed out at 180 on a run that took the restore path -- a timeout reports as a failure with no
# output at all, which is the least diagnosable red there is.
set_tests_properties(fixture-test PROPERTIES SKIP_RETURN_CODE 77 TIMEOUT 420)
"""

[target.fixture-test.properties]
OUTPUT_NAME = "fixture-test"
RUNTIME_OUTPUT_DIRECTORY_RELEASE = "${CMAKE_BINARY_DIR}/bin"
RUNTIME_OUTPUT_DIRECTORY_RELWITHDEBINFO = "${CMAKE_BINARY_DIR}/bin"
RUNTIME_OUTPUT_DIRECTORY_DEBUG = "${CMAKE_BINARY_DIR}/bin"

# --- ctest headless unit runner (Tier-1) -------------------------------------
# Black-box tests the CommandServer over localhost HTTP in-process -- NO game,
# NO GPU -- so it ALWAYS runs and must pass on any CI. No SKIP_RETURN_CODE.
[target.ipcbench]
type = "executable"
sources = ["tools/ipcbench/main.cpp"]
compile-features = ["cxx_std_23"]
compile-definitions = ["NOMINMAX", "WIN32_LEAN_AND_MEAN", "_CRT_SECURE_NO_WARNINGS"]

[target.ipcbench.properties]
OUTPUT_NAME = "ipcbench"
RUNTIME_OUTPUT_DIRECTORY_RELEASE = "${CMAKE_BINARY_DIR}/bin"
RUNTIME_OUTPUT_DIRECTORY_RELWITHDEBINFO = "${CMAKE_BINARY_DIR}/bin"
RUNTIME_OUTPUT_DIRECTORY_DEBUG = "${CMAKE_BINARY_DIR}/bin"


[target.command-server-test]
type = "executable"
sources = ["test/command_server_tests.cpp", "src/ipc/CommandServer.cpp"]
include-directories = ["src/ipc", "src", "shared"]
compile-features = ["cxx_std_23"]
compile-definitions = ["NOMINMAX", "WIN32_LEAN_AND_MEAN", "_CRT_SECURE_NO_WARNINGS"]
link-libraries = ["ws2_32"]
cmake-after = """
add_test(NAME command-server-test COMMAND command-server-test)
set_tests_properties(command-server-test PROPERTIES TIMEOUT 60)

# ---- PRINTF ARGUMENTS, CHECKED BY MACHINE ------------------------------------------------------
#
# The host's periodic log line broke three times in one session: arguments inserted where they read
# well in the source rather than where the format wanted them, a double printed through %llu, and a
# format field left behind after its argument was deleted -- which handed a float to %s and CRASHED
# THE HOST inside strnlen. MSVC does not warn at this project's level, and a 36-argument call
# cannot be checked by eye; I signed off on that one twice while it was wrong.
#
# Needs no build and no game, so it costs a fraction of a second on every ctest run.
#
# REGISTERED EITHER WAY. This used to be wrapped in `if(Python3_Interpreter_FOUND)`, so on a
# machine without Python the test simply CEASED TO EXIST -- ctest reported three passing targets
# and a mandatory check had silently left the suite. A check that can disappear is not mandatory,
# and "it passed" then means something different depending on the machine. When Python is missing
# the target is registered as a FAILING one that says why, which is loud, honest and fixable.
find_package(Python3 COMPONENTS Interpreter QUIET)
if(Python3_Interpreter_FOUND)
	add_test(NAME format-strings
		COMMAND ${Python3_EXECUTABLE} "${CMAKE_SOURCE_DIR}/tools/check_formats.py"
		WORKING_DIRECTORY "${CMAKE_SOURCE_DIR}")
else()
	# FAILS WITH A REASON. `cmake -E false` would fail silently, which turns "mandatory check
	# absent" into "mandatory check red for no stated cause" -- barely an improvement. A one-line
	# script says what is missing and how to fix it, in the ctest output where someone will read it.
	file(WRITE "${CMAKE_BINARY_DIR}/format_strings_no_python.cmake"
		"message(FATAL_ERROR \\"format-strings needs a Python 3 interpreter and CMake found none. Install Python 3 or put it on PATH; this check is not optional -- see tools/check_formats.py.\\")\\n")
	add_test(NAME format-strings
		COMMAND ${CMAKE_COMMAND} -P "${CMAKE_BINARY_DIR}/format_strings_no_python.cmake")
endif()
set_tests_properties(format-strings PROPERTIES TIMEOUT 60)
"""

[target.command-server-test.properties]
OUTPUT_NAME = "command-server-test"
RUNTIME_OUTPUT_DIRECTORY_RELEASE = "${CMAKE_BINARY_DIR}/bin"
RUNTIME_OUTPUT_DIRECTORY_RELWITHDEBINFO = "${CMAKE_BINARY_DIR}/bin"
RUNTIME_OUTPUT_DIRECTORY_DEBUG = "${CMAKE_BINARY_DIR}/bin"
